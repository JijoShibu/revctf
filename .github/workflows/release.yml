name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v, such as 2.0.0
        required: true
        type: string
      commit:
        description: Reviewed full commit ID on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  verify:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and release evidence
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          python3 tools/release.py gate --version "$VERSION" --commit "$REQUESTED_COMMIT"
      - name: Build source package
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          checksum=$(python3 tools/release.py build --version "$VERSION" --output "$RUNNER_TEMP/package")
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
  publish:
    needs: verify
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild the verified package
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.checksum }}
        run: |
          actual=$(python3 tools/release.py build --version "$VERSION" --output "$RUNNER_TEMP/package")
          test "$actual" = "$EXPECTED_SHA256"
      - name: Publish after maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: python3 tools/publish-release.py --version "$VERSION" --commit "$REQUESTED_COMMIT" --package "$RUNNER_TEMP/package"
